title: "Kayne Docs"
description: "Official documentation for Kayne v∞"
url: "https://docs.ilovekayne.xyz"
remote_theme: just-the-docs/just-the-docs@v0.10.1

color_scheme: dark
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Main Kayne Blog": "https://ilovekayne.xyz"
  "All The Blogs": "https://blogs.ilovekayne.xyz"
aux_links_new_tab: false

footer_content: "Kayne Docs are maintained by people who love Kayne. Kayne is not open source, but he is very open to helping."

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  tip:
    title: Pro tip
    color: green

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
